version: '3.8'

services:
  mongo:
    image: mongo
    container_name: Mongo
    ports:
      - "28017:27017"
    networks:
      - Mongo-Network
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env - see .env.example}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env - see .env.example}"
    restart: unless-stopped

  mongo-express:
    image: mongo-express
    container_name: Mongo-Express
    ports:
      - "8081:8081"
    networks:
      - Mongo-Network
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: "${ME_MONGO_USERNAME:?Set ME_MONGO_USERNAME in .env - see .env.example}"
      ME_CONFIG_MONGODB_ADMINPASSWORD: "${ME_MONGO_PASSWORD:?Set ME_MONGO_PASSWORD in .env - see .env.example}"
      ME_CONFIG_MONGODB_URL: "mongodb://${ME_MONGO_USERNAME}:${ME_MONGO_PASSWORD}@mongo:27017"
    depends_on:
      - mongo
    restart: unless-stopped

networks:
  Mongo-Network:
    driver: bridge